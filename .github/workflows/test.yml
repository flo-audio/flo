name: Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-rust:
    name: Test libflo (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Build/crates/libflo

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run Rust tests
        run: just libflo test

  test-wasm:
    name: Test libflo (WASM/Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Build/crates/libflo

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: Build/crates/libflo/tests/js/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('Build/crates/libflo/tests/js/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM and run Jest tests
        run: just libflo test_wasm