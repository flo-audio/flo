[package]
name = "reflo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Audio format converter for the flo™ audio format. Available as CLI and library with WebAssembly support"
keywords = ["audio", "codec", "compression", "wasm", "converter"]
categories = ["multimedia::audio", "multimedia::encoding", "command-line-utilities", "wasm"]
readme = "README.md"
homepage = "https://github.com/Audiflo/flo"

[[bin]]
name = "reflo"
path = "src/main.rs"

[lib]
name = "reflo"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
libflo-audio = { workspace = true }
clap = { version = "4", features = ["derive"], optional = true }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Symphonia for all audio formats including WAV
symphonia = { version = "0.5", features = [
    "mp3",
    "flac", 
    "ogg",
    "vorbis",
    "aac",
    "isomp4",
    "pcm",
    "wav",
] }

# WASM dependencies
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook", "dep:serde-wasm-bindgen"]